name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate semantic-version tag
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must have the form vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Verify tag commit is on main
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git fetch --no-tags origin main
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Tag must point to a commit reachable from main"
            exit 1
          fi

      - name: Verify changelog entry
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          version_pattern="${version//./\\.}"
          if ! grep -Eq "^## \[$version_pattern\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated entry for $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Verify installation documentation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          install="go get github.com/go-muse/go-musicxml@$GITHUB_REF_NAME"
          if ! grep -Fxq -- "$install" README.md; then
            echo "README.md installation command must use $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install xmllint
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libxml2-utils

      - name: Run release checks
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            export MUSICXML_REQUIRE_XMLLINT=1
          fi
          bash scripts/release-check.sh

  publish:
    name: Create GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build release notes from changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 {
              found = 1
              next
            }
            found && /^## \[/ {
              exit
            }
            found && /^\[[^]]+\]:/ {
              exit
            }
            found {
              print
            }
            END {
              if (!found) {
                exit 1
              }
            }
          ' CHANGELOG.md > "$notes"
          if [[ ! -s "$notes" ]]; then
            echo "Release notes for $GITHUB_REF_NAME are empty"
            exit 1
          fi
          echo "RELEASE_NOTES=$notes" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "go-musicxml $GITHUB_REF_NAME" \
            --notes-file "$RELEASE_NOTES"
