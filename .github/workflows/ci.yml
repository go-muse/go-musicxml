name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # Off for now (owner, 2026-11-08); see CONTRIBUTING.md to restore.
          # - macos-latest
          # - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Check module files
        shell: bash
        run: bash scripts/check-all.sh mod

      - name: Check generated code
        shell: bash
        run: bash scripts/check-all.sh generate

      - name: Check formatting
        shell: bash
        run: bash scripts/check-all.sh format

      - name: Verify package inventory and hash controls
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go run ./cmd/package-inventory verify --strict-evidence
          go run ./cmd/package-inventory test
          go test -count=1 ./internal/packageinventory

      - name: Run go vet
        shell: bash
        run: bash scripts/check-all.sh vet

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # Off for now (owner, 2026-11-08); see CONTRIBUTING.md to restore.
          # - macos-latest
          # - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run tests
        shell: bash
        run: bash scripts/check-all.sh test

  race-root:
    name: Race detector (root)
    # Off for now (owner, 2026-11-08); see CONTRIBUTING.md to restore.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run tests with race detector
        shell: bash
        env:
          RACE_SHARD: root
        run: |
          printf 'Available CPUs: '
          nproc
          awk '/^MemTotal:/ { print }' /proc/meminfo
          /usr/bin/time -v bash scripts/check-all.sh race

  race-packages:
    name: Race detector (packages)
    # Off for now (owner, 2026-11-08); see CONTRIBUTING.md to restore.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run tests with race detector
        shell: bash
        env:
          RACE_SHARD: packages
        run: |
          printf 'Available CPUs: '
          nproc
          awk '/^MemTotal:/ { print }' /proc/meminfo
          /usr/bin/time -v bash scripts/check-all.sh race

  race:
    name: Race detector
    needs: [race-root, race-packages]
    # Off for now (owner, 2026-11-08); see CONTRIBUTING.md to restore.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require both race shards
        if: ${{ always() }}
        shell: bash
        env:
          ROOT_RESULT: ${{ needs.race-root.result }}
          PACKAGES_RESULT: ${{ needs.race-packages.result }}
        run: |
          if [[ "$ROOT_RESULT" != success || "$PACKAGES_RESULT" != success ]]; then
            printf 'Race shards did not both succeed (root=%s, packages=%s).\n' "$ROOT_RESULT" "$PACKAGES_RESULT" >&2
            exit 1
          fi

  xsd-conformance:
    name: External XSD conformance
    # The oracle comparisons and their recorded divergences are calibrated
    # against libxml2 2.9.14. libxml2 2.15 (Ubuntu 26.04) accepts XML 1.0
    # fifth-edition name characters in XSD names and changes xmllint's exit
    # status for well-formedness errors.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libxml2-utils

      - name: Validate corpus and raw XML/XSD contracts
        env:
          MUSICXML_REQUIRE_XMLLINT: "1"
        run: go test -count=1 -run='^(TestEncodedCorpusConformsToMusicXMLSchema|TestAnyURILexicalFormsAgainstOpusSchema|TestElementAttributeContractsAgainstSchema|TestNilContractsAgainstSchema|TestElementValueConstraintsAgainstSchema|TestFixedElementChildrenAgainstSchema|TestElementOnlyXMLWhitespaceAgainstSchema|TestEmptyComplexContentAgainstSchema|TestXMLDocumentWhitespaceAgainstXMLLint|TestXMLDocumentLexicalAgainstXMLLint|TestSourceInternalDTDAgainstXMLLint|TestIntegerValueSpacesAgainstSchema|TestDecimalComparisonsAgainstSchema|TestDecimalDigitFacetsAgainstSchema|TestSimpleContentRestrictionsAgainstSchema|TestEffectiveWhitespaceAgainstSchema|TestPatternGroupsAgainstSchema|TestBuiltinListLengthsAgainstSchema|TestAggregateValuesAgainstSchema|TestUnionMemberFlatteningAgainstSchema|TestPrimitiveValuesAgainstSchema|TestDatatypeNamesAgainstSchema|TestDatatypeNamesProductionAgainstSchema|TestGrammarParticlesAgainstSchema|TestXSITypeAgainstSchema|TestSchemaHintDatatypesAgainstSchema|TestXSD10IdentityBindingsAgainstSchema|TestSourceAssessmentAgainstSchema|TestAuxiliarySourceAgainstOriginalSchema|TestAttributeWildcardUnionAgainstXMLLint|TestAttributeWildcardUnexpressibleUnionXMLLintSchemaError)$' .

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run fuzz targets
        run: bash scripts/check-all.sh fuzz
